<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><base href="/"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车队渲染回归测试</title><style>body{margin:0;background:#f8ebc2;color:#433547;font:14px system-ui}#world{height:calc(100svh - 100px);width:100%}#controls{padding:12px;display:flex;gap:12px;align-items:center}button{padding:10px;border:1px solid #433547;background:#b3dfcf;border-radius:8px}output{display:block;padding:5px 12px}</style></head><body><div id="controls"><button id="dense">15关密集车队 / 五炮台</button><button id="fire">开始集火</button><button id="damage">反复更新血量 200 次</button></div><output id="result">等待检查</output><div id="world"></div><script type="module">
import {Game,ENEMY_GAP} from '/src/simulation.ts';
import {World} from '/src/world.ts';
const game=new Game(),world=new World(document.querySelector('#world'));let firing=false;
function fixture(){world.reset();game.wave=15;game.coins=100000;game.mode='ready';game.towerCount=1;game.start();while(game.canBuild())game.buildTower();game.levels={power:9,haste:7,chain:3};while(game.enemies.length<25)game.spawn(true);game.enemies.forEach((e,i)=>{e.p=.86-i*ENEMY_GAP;});game.hp=1000;game.events=[];world.update(game,0);firing=false;document.querySelector('#result').textContent=`测试场景：${game.enemies.length} 个敌人、${world.towers.length} 座炮台，首车头 ${game.enemies[0].hp} 血`;}
document.querySelector('#dense').onclick=fixture;
document.querySelector('#fire').onclick=()=>{firing=!firing;document.querySelector('#fire').textContent=firing?'暂停集火':'开始集火';};
document.querySelector('#damage').onclick=()=>{const e=game.enemies.find(e=>e.boss),label=world.enemies.get(e.id).getObjectByName('hp'),material=label.material,texture=material.map;for(let i=0;i<200;i++){e.hp--;world.update(game,0);if(label.material!==material||label.material.map!==texture)throw Error('血量更新重新创建了材质或纹理');}document.querySelector('#result').textContent=`PASS：200 次血量更新，材质 / 纹理保持同一对象；深度遮挡关闭=${!material.depthTest}；炮台=${world.towers.length}`;};
fixture();let last=performance.now();function frame(now){const dt=Math.min(.03,(now-last)/1000);last=now;if(firing){game.tick(dt);for(const event of game.events)world.event(event);game.events=[];}world.update(game,dt);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
